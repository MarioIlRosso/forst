[package]
name = "forst"
version = "0.1.0"
edition = "2024"
description = "a rust tree cli program"
license = "MIT"
repository = "https://github.com/GennaroBiondi/forst"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
forst-config = { version = "0.1.0", path = "../forst-config" }
forst-core = { version = "0.1.0", path = "../forst-core" }

[[bin]]
name = "forst"
path = "src/main.rs"
